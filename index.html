<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prathamesh Gorle — Cloud Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 3rem 2.5rem; max-width: 560px; text-align: center; }
    h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 0.5rem; }
    .role { color: #94a3b8; font-size: 1rem; margin-bottom: 1.5rem; }
    .badge { display: inline-block; background: #0ea5e9; color: #fff; font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; margin: 4px; }
    .hosted { margin-top: 2rem; font-size: 0.8rem; color: #475569; }
    .hosted span { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Prathamesh Gorle</h1>
    <div class="role">Cloud Engineer · AWS Certified</div>
    <div>
      <span class="badge">AWS SAA-C03</span>
      <span class="badge">AWS CLF-C02</span>
      <span class="badge">Python</span>
      <span class="badge">DevOps</span>
    </div>
    <div class="hosted">
      Hosted securely on <span>Amazon S3 + CloudFront</span> with HTTPS
    </div>
  </div>
</body>
</html>
